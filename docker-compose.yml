version: "3.4"

services:
  wp:
    # If you want to use the default image
    # image: wordpress:latest # https://hub.docker.com/_/wordpress/
    # If you want to build a wordpress image with default self signed certs for Apache
    # See Dockerfile
    container_name: wp
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    image: wordpress:latest
    restart: always
    ports:
      - ${IP}:80:80 # change ip if required
      - ${IP}:443:443
    volumes:
      - ./config/php.conf.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./wp-app:/var/www/html # Full wordpress project - if it exists, and once it exists.
      - ./cioos-siooc-wordpress-theme:/var/www/html/wp-content/themes/cioos-siooc-wordpress-theme # Theme development from this folder. - should overwrite above?
    environment:
      WORDPRESS_DB_HOST: wp_db
      WORDPRESS_DB_NAME: ${DOCKER_DB_NAME}
      WORDPRESS_DB_USER: ${DOCKER_DB_USER}
      WORDPRESS_DB_PASSWORD: ${DOCKER_DB_PASSWORD}
      # WORDPRESS_CONFIG_EXTRA: |
      #   define('WP_DEBUG', true );
      #   define('WP_HOME','https://cioos.local');
      #   define('WP_SITEURL','https://cioos.local');
      # PHP_EXTENSION_XDEBUG: 1

    depends_on:
      - wp_db
    links:
      - wp_db

  wpcli:
    image: wordpress:cli
    container_name: wpcli
    volumes:
      - ./config/php.conf.ini:/usr/local/etc/php/conf.d/conf.ini
      - ./wp-app:/var/www/html
    user: 33:33
    environment:
      WORDPRESS_DB_HOST: wp_db
      WORDPRESS_DB_NAME: ${DOCKER_DB_NAME}
      WORDPRESS_DB_USER: ${DOCKER_DB_USER}
      WORDPRESS_DB_PASSWORD: ${DOCKER_DB_PASSWORD}
    depends_on:
      - wp_db
      - wp

  pma:
    image: phpmyadmin/phpmyadmin
    container_name: wp-pma
    environment:
      # https://docs.phpmyadmin.net/en/latest/setup.html#docker-environment-variables
      PMA_HOST: wp_db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASSWORD}
    ports:
      - ${IP}:9500:80
    links:
      - wp_db:wp_db

  wp_db:
    image: mariadb:10.6
    restart: always
    container_name: wp_db
    ports:
      - ${IP}:3306:3306 # change ip if required
    command:
      [
        "--default_authentication_plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_PASSWORD}
      MYSQL_USER: ${DOCKER_DB_USER}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD}

volumes:
  db_data:
  wp-app:
